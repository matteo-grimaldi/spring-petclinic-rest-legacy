apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: spring-petclinic-rest-legacy
  title: Spring PetClinic REST (legacy)
  description: |
    Existing freeze-fork of spring-petclinic-rest (javax-era legacy specimen).
    Registered in Developer Hub for Tekton CI and agent demos;
  annotations:
    backstage.io/source-location: url:https://github.com/matteo-grimaldi/spring-petclinic-rest-legacy
    backstage.io/kubernetes-id: spring-petclinic-rest-legacy
    janus-idp.io/tekton: spring-petclinic-rest-legacy
    tekton.dev/cicd: "true"
  tags:
    - java
    - spring-boot
    - petclinic
    - rest
    - docker
spec:
  type: service
  lifecycle: experimental
  owner: demo-team
  system: agentic-doc-generation
  providesApis:
    - spring-petclinic-rest-legacy-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: spring-petclinic-rest-legacy-api
  title: Spring PetClinic REST API
  description: |
    REST API exposed by spring-petclinic-rest-legacy, covering pet owners,
    pets, vet visits, pet types and vets.
  annotations:
    backstage.io/source-location: url:https://github.com/matteo-grimaldi/spring-petclinic-rest-legacy
spec:
  type: openapi
  definition:
    $text: ./src/main/resources/api-docs.yml
