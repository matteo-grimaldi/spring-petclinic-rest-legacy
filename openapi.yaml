openapi: "3.0.3"
info:
  title: Spring Petclinic REST (legacy)
  description: >
    REST API for the Spring Petclinic legacy sample, exposing CRUD endpoints
    for clinic owners and pets. Endpoints require role OWNER_ADMIN
    (@PreAuthorize).
  version: "1.0.0"
paths:
  /api/owners:
    get:
      operationId: getOwners
      summary: List all owners
      tags: [owners]
      security:
        - role: ["OWNER_ADMIN"]
      responses:
        "200":
          description: A collection of owners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerDto"
        "404":
          description: No owners found
    post:
      operationId: addOwner
      summary: Create a new owner
      tags: [owners]
      security:
        - role: ["OWNER_ADMIN"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerDto"
      responses:
        "201":
          description: Owner created; Location header points to /api/owners/{id}
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDto"
        "400":
          description: Validation errors (see `errors` response header)
          x-confidence: low
  /api/owners/{ownerId}:
    parameters:
      - name: ownerId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getOwner
      summary: Get an owner by id
      tags: [owners]
      security:
        - role: ["OWNER_ADMIN"]
      responses:
        "200":
          description: The owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDto"
        "404":
          description: Owner not found
    put:
      operationId: updateOwner
      summary: Update an owner
      tags: [owners]
      security:
        - role: ["OWNER_ADMIN"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerDto"
      responses:
        "204":
          description: Owner updated
        "400":
          description: Validation errors or id mismatch (see `errors` response header)
          x-confidence: low
        "404":
          description: Owner not found
    delete:
      operationId: deleteOwner
      summary: Delete an owner
      tags: [owners]
      security:
        - role: ["OWNER_ADMIN"]
      responses:
        "204":
          description: Owner deleted
        "404":
          description: Owner not found
  /api/owners/*/lastname/{lastName}:
    get:
      operationId: getOwnersList
      summary: List owners by last name (substring match)
      tags: [owners]
      security:
        - role: ["OWNER_ADMIN"]
      parameters:
        - name: lastName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching owners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerDto"
        "404":
          description: No owners matched
  /api/pets:
    get:
      operationId: getPets
      summary: List all pets
      tags: [pets]
      security:
        - role: ["OWNER_ADMIN"]
      responses:
        "200":
          description: A collection of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PetDto"
        "404":
          description: No pets found
    post:
      operationId: addPet
      summary: Create a new pet
      tags: [pets]
      security:
        - role: ["OWNER_ADMIN"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetDto"
      responses:
        "201":
          description: Pet created; Location header points to /api/pets/{id}
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetDto"
        "400":
          description: Validation errors (see `errors` response header)
          x-confidence: low
  /api/pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getPet
      summary: Get a pet by id
      tags: [pets]
      security:
        - role: ["OWNER_ADMIN"]
      responses:
        "200":
          description: The pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetDto"
        "404":
          description: Pet not found
    put:
      operationId: updatePet
      summary: Update a pet
      tags: [pets]
      security:
        - role: ["OWNER_ADMIN"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetDto"
      responses:
        "204":
          description: Pet updated
        "400":
          description: Validation errors (see `errors` response header)
          x-confidence: low
        "404":
          description: Pet not found
    delete:
      operationId: deletePet
      summary: Delete a pet
      tags: [pets]
      security:
        - role: ["OWNER_ADMIN"]
      responses:
        "204":
          description: Pet deleted
        "404":
          description: Pet not found
  /api/pets/pettypes:
    get:
      operationId: getPetTypes
      summary: List all pet types
      tags: [pets]
      security:
        - role: ["OWNER_ADMIN"]
      responses:
        "200":
          description: A collection of pet types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PetTypeDto"
components:
  securitySchemes:
    role:
      type: apiKey
      in: header
      name: role
      description: Placeholder — all endpoints are guarded by @PreAuthorize("hasRole(@roles.OWNER_ADMIN)")
  schemas:
    OwnerDto:
      type: object
      description: DTO for an owner (fields inferred from the Owner model; the OwnerDto source file was not available to verify exact shape).
      x-confidence: low
      properties:
        id:
          type: integer
          format: int32
        firstName:
          type: string
        lastName:
          type: string
        address:
          type: string
        city:
          type: string
        telephone:
          type: string
        pets:
          type: array
          items:
            $ref: "#/components/schemas/PetDto"
    PetDto:
      type: object
      description: DTO for a pet (fields inferred from the Pet model; the PetDto source file was not available to verify exact shape).
      x-confidence: low
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        birthDate:
          type: string
          format: date
        type:
          $ref: "#/components/schemas/PetTypeDto"
    PetTypeDto:
      type: object
      description: DTO for a pet type (inferred from NamedEntity).
      x-confidence: low
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    BindingErrorsResponse:
      type: object
      description: Validation error details returned in the `errors` response header as JSON.
      additionalProperties:
        type: string
